name: Pages

# Publish web/index.html, with the wheels it installs built beside it, so the
# browser viewer can be opened without building anything. quid2pmi's wheel goes
# too: the page offers to recognise features in a file that carries no PMI, and
# fetches it only if someone asks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pzfreo/quid2pmi
          path: .quid2pmi
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --wheel --out-dir web
      - run: uv build --wheel .quid2pmi --out-dir web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
