name: Pages

# The viewer has moved to Draftwright Specify (editor.draftwright.io/specify); this
# publishes web/index.html, a page that sends visitors there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
