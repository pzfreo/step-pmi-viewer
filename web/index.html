<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-pmi-viewer</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://files.pythonhosted.org" crossorigin>
<link rel="preconnect" href="https://pypi.org">
<script defer src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f8fa; --ink: #1a1d21; --muted: #707880; --line: #d9dee4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --panel: #1e2226; --ink: #e9ecef; --muted: #98a2ac; --line: #333a41; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header b { font-size: 13px; font-weight: 650; }
  #status { color: var(--muted); flex: 1; }
  #bar { width: 130px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #2f6fb5; transition: width .15s linear; }
  #bar.busy i { width: 45%; transition: none; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(245%); } }
  #status.bad { color: #c0392b; }
  button, label.file {
    font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: inherit; cursor: pointer;
  }
  button[disabled] { opacity: .45; cursor: default; }
  input[type=file] { display: none; }
  main { flex: 1; position: relative; }
  #drop {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    padding: 24px; color: var(--muted);
  }
  #drop.over { background: var(--panel); }
  #drop h1 { font-size: 15px; font-weight: 650; color: var(--ink); margin: 0; }
  /* There is nothing to drag a file with on a touch screen, so the invitation
     to drop one is an instruction that cannot be followed. */
  #drop h1.narrow { display: none; }
  @media (hover: none) {
    #drop h1.wide { display: none; }
    #drop h1.narrow { display: block; }
  }
  #drop p { margin: 0; max-width: 34em; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }

  /* A phone cannot fit the name, the status, the progress bar and three buttons
     on one row: they ran off the right edge, and choosing a file was out of
     reach. Let the row wrap, and let the status and its progress fall past the
     buttons to wherever there is room.

     780, not 640, because that is where the fourth control stops fitting: below
     it the row wraps cleanly, and just above it the same row was squeezed until
     the buttons wrapped their own text, which made 660 taller than 800. */
  @media (max-width: 780px) {
    header { flex-wrap: wrap; gap: 6px 8px; }
    header b { flex: 1 0 auto; }
    #status { order: 8; flex: 1 1 auto; }
    #bar { order: 9; flex: 0 0 auto; }
  }
  @media (max-width: 640px) {
    #drop { padding: 18px; }
  }
  body.showing #drop { display: none; }
  body.showing iframe { display: block; }
</style>
</head>
<body>
<header>
  <b>step-pmi-viewer</b>
  <span id="status">starting…</span>
  <div id="bar"><i id="fill"></i></div>
  <label class="file">choose a STEP file<input id="file" type="file" accept=".stp,.step,.STP,.STEP"></label>
  <button id="save" disabled>Save Live HTML</button>
  <button id="saveStep" hidden>Save PMI STEP</button>
</header>
<main>
  <div id="drop">
    <h1 class="wide">Drop a STEP file here</h1>
    <h1 class="narrow">Choose a STEP file</h1>
    <p>The file is read in this tab — the PMI is extracted by OpenCASCADE compiled to
       WebAssembly, and nothing is uploaded anywhere.</p>
  </div>
  <iframe id="view" title="the part and its PMI"></iframe>
</main>

<script>
// OCCT for Pyodide comes from yeicor/OCP.wasm, whose wheels are built against one
// Pyodide ABI at a time: bump the loader above and this pin together. Stay on the
// 7.9 line -- OCP 8 renames the collection types the reader imports.
const OCP = { name: "cadquery-ocp-novtk-OCP.wasm", version: "7.9.3.1.post202609191800" };
// Built with `uv build --wheel --out-dir web`. Installed without its dependencies:
// build123d is only ever a way to get OCP, and here OCP is already installed.
const PACKAGE = "./step_pmi_viewer-0.1.0-py3-none-any.whl";
// Feature recognition, for a file with no PMI of its own. Installed on demand:
// build123d drags in scipy, scikit-learn and sympy, which nobody should pay for
// unless they ask. Built beside this page by the same workflow.
const RECOGNISER = "./quid2pmi-0.1.0-py3-none-any.whl";
// The wheel keeps its name across releases, so a browser that has seen one will
// happily reuse it and a fix never reaches the page. Fetch it here, where the
// cache can be bypassed, and install it off the Emscripten filesystem.

const GLUE = `
import json, pathlib, tempfile
from step_pmi_viewer import read_scene, render

def convert(name, data):
    work = pathlib.Path(tempfile.mkdtemp())
    source = work / name
    source.write_bytes(bytes(data))
    scene = read_scene(source, work / "part.glb")
    return json.dumps({"html": render(scene), "name": scene.name, "counts": scene.counts()})

def recognise(name, data):
    from quid2pmi import convert as run

    work = pathlib.Path(tempfile.mkdtemp())
    source = work / name
    source.write_bytes(bytes(data))
    page = work / "page.html"
    # The AP242 file is the point of recognising, not a by-product: it carries the
    # features as PMI a CAD system can read, where the page only draws them.
    step = work / f"{source.stem}-pmi.step"
    report = run(source, step, viewer=page, quiet=True)
    return json.dumps({"html": page.read_text(), "name": source.stem,
                       "counts": dict(report.counts), "step": str(step)})


def step_bytes(path):
    """The written AP242 file, handed over when it is asked for.

    As bytes, not text: Pyodide would widen a str to UTF-16 on the way across
    and the Blob would copy that again, so a large part would peak at several
    times its own size for no reason. The file itself is on MEMFS, which is the
    heap, so waiting until the button is pressed saves no memory -- it only
    keeps the conversion out of the way of a page nobody asked to save.
    """
    return pathlib.Path(path).read_bytes()
`;

// micropip resolves from metadata, so it cannot know these are never called.
// lib3mf (3MF export) and psutil have no wasm wheel at all; OCP is already here
// under the name OCP.wasm publishes it as. build123d is pinned below 0.12,
// which wants an OCP 8 that OCP.wasm does not build.
// OCP.wasm binds some OCCT namespaces as modules of plain functions where
// desktop OCP binds them as classes of statics named with an _s suffix, and
// quiddity, build123d and this package all call the _s spelling. Alias the
// names back on: setattr works on a module and is refused on a pybind11 class,
// so this only touches the bindings that differ.
const ALIASES = `
import importlib

NAMESPACES = (
    "BinTools BRep_Tool BRepAlgo BRepBndLib BRepFill BRepGProp BRepLib BRepLProp "
    "BRepTools Font_FontMgr GCPnts_AbscissaPoint GeomAPI GeomConvert GeomProjLib "
    "IGESControl_Controller Interface_Static Message Precision Quantity_Color RWStl "
    "ShapeAnalysis_Curve ShapeAnalysis_FreeBounds ShapeCustom STEPCAFControl_Controller "
    "STEPControl_Controller TDataStd_Name TDF_Tool TopExp TopoDS XCAFApp_Application "
    "XCAFDoc_ColorTool XCAFDoc_Datum XCAFDoc_Dimension XCAFDoc_DocumentTool "
    "XCAFDoc_GeomTolerance XCAFDoc_ShapeTool XCAFDoc_View"
).split()

for qualified in NAMESPACES:
    try:
        namespace = getattr(importlib.import_module("OCP." + qualified.split("_")[0]), qualified)
    except (ImportError, AttributeError):
        continue
    for attr in dir(namespace):
        if attr.startswith("_") or attr.endswith("_s") or hasattr(namespace, attr + "_s"):
            continue
        try:
            setattr(namespace, attr + "_s", getattr(namespace, attr))
        except (AttributeError, TypeError):
            pass
`;

const STANDINS = `
import micropip
micropip.add_mock_package("cadquery-ocp-novtk", "7.9.3", modules={})
micropip.add_mock_package("psutil", "7.1.0")
# Any attribute of this stand-in is the stand-in again, to any depth: build123d
# reads Lib3MF.ModelUnit.MilliMeter and a dozen more like it while building a
# units table at import time, so an empty class is not enough.
micropip.add_mock_package("lib3mf", "2.5.0", modules={"lib3mf": """
class _Anything(type):
    def __getattr__(cls, name):
        return cls


class Lib3MF(metaclass=_Anything):
    pass
"""})
`;

const statusEl = document.getElementById("status");
const barEl = document.getElementById("bar");
const fillEl = document.getElementById("fill");
const fileEl = document.getElementById("file");
const saveEl = document.getElementById("save");
const stepEl = document.getElementById("saveStep");
const dropEl = document.getElementById("drop");
const viewEl = document.getElementById("view");

let pyodideRef = null; // kept so recognition can be installed later
let convert = null;   // the Python entry point, once everything is installed
let recognise = null; // the same for feature recognition, installed on demand
let stepBytes = null; // reads the AP242 file recognition wrote, on demand
let pending = null;   // a file chosen while still loading
let saved = null;     // {url, name} of the page now on screen
let ap242 = null;     // {path, name} of the AP242 file, when features were recognised

let stage = "";           // the last thing said, so a queued file can be added to it
const say = (text, bad) => {
  stage = text;
  statusEl.textContent = pending ? `${text} — ${pending.name} is queued` : text;
  statusEl.classList.toggle("bad", !!bad);
};
// Let the status paint before a call that holds the thread for seconds.
const painted = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

// The runtime is about 13 MB and the kernel wheel about 23 MB, and they arrive at
// the same time, so the bar is the share of those bytes that has landed. Only the
// wheel can be measured as it comes; the runtime counts when Pyodide is up.
let runtime = 0, kernel = 0;
const advance = () => { fillEl.style.width = `${Math.round(100 * (0.35 * runtime + 0.65 * kernel))}%`; };
// Unpacking the kernel and reading a part both hold the thread, so the bar sweeps
// instead: the animation runs on the compositor and keeps moving regardless.
const busy = (on) => {
  barEl.hidden = !on;
  barEl.classList.toggle("busy", on);
  if (on) fillEl.style.width = "";
};

/** The OCCT wheel, downloaded by hand so its progress can be shown. */
async function fetchKernel() {
  const release = await fetch(`https://pypi.org/pypi/${OCP.name}/${OCP.version}/json`);
  const wheel = (await release.json()).urls.find(u => u.filename.endsWith(".whl"));
  const reader = (await fetch(wheel.url)).body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    kernel = Math.min(got / wheel.size, 1);
    advance();
  }
  const bytes = new Uint8Array(got);
  let at = 0;
  for (const chunk of chunks) { bytes.set(chunk, at); at += chunk.length; }
  return { name: wheel.filename, bytes };
}

async function boot() {
  say("loading Python and the CAD kernel…");
  const pyodide = pyodideRef = await loadPyodide();
  runtime = 1;
  advance();
  await pyodide.loadPackage("micropip");
  const micropip = pyodide.pyimport("micropip");
  const wheel = await kernelWheel;
  say("installing…");
  busy(true);
  pyodide.FS.writeFile("/" + wheel.name, wheel.bytes);
  // callKwargs, or the options object would land on micropip.install's second positional.
  await micropip.install.callKwargs("emfs:/" + wheel.name, { deps: false });
  const own = PACKAGE.split("/").pop();
  pyodide.FS.writeFile("/" + own,
    new Uint8Array(await (await fetch(PACKAGE, { cache: "reload" })).arrayBuffer()));
  await micropip.install.callKwargs("emfs:/" + own, { deps: false });
  await pyodide.runPythonAsync(GLUE);
  convert = pyodide.globals.get("convert");
  busy(false);
  say("ready — choose a STEP file");
  if (pending) show(pending);
}

/** Install the recognition stack. Only called when someone asks for it. */
async function fetchRecogniser() {
  const micropip = pyodideRef.pyimport("micropip");
  await pyodideRef.runPythonAsync(STANDINS);
  await micropip.install("build123d<0.12");
  await micropip.install("quiddity");
  const own = RECOGNISER.split("/").pop();
  pyodideRef.FS.writeFile("/" + own,
    new Uint8Array(await (await fetch(RECOGNISER, { cache: "reload" })).arrayBuffer()));
  await micropip.install.callKwargs("emfs:/" + own, { deps: false });
  await micropip.install("rich");
  await pyodideRef.runPythonAsync(ALIASES);
  await pyodideRef.runPythonAsync(GLUE);
  recognise = pyodideRef.globals.get("recognise");
  stepBytes = pyodideRef.globals.get("step_bytes");
}

/** Put a finished page on screen and report what is on it. */
function display(result, what) {
  if (saved) URL.revokeObjectURL(saved.url);
  saved = {
    url: URL.createObjectURL(new Blob([result.html], { type: "text/html" })),
    name: result.name + ".html",
  };
  viewEl.src = saved.url;
  document.body.classList.add("showing");
  saveEl.disabled = false;
  // Only recognition writes one: a file that already carried PMI has its own
  // AP242 on disk already, and offering to save it back would say nothing new.
  ap242 = result.step ? { path: result.step, name: result.name + "-pmi.step" } : null;
  stepEl.hidden = !ap242;
  const counts = Object.entries(result.counts).sort();
  const total = counts.reduce((n, [, c]) => n + c, 0);
  say(`${result.name}: ${total} ${what}` +
      (counts.length ? ` (${counts.map(([g, c]) => `${c} ${g}`).join(", ")})` : ""));
}

async function show(file) {
  if (!convert) { pending = file; say(stage); return; }
  pending = null;
  say(`reading ${file.name}…`);
  busy(true);
  await painted();
  let result, bytes;
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
    result = JSON.parse(convert(file.name, bytes));
  } catch (err) {
    busy(false);
    say(String(err.message || err).trim().split("\n").pop(), true);
    return;
  }
  // Nothing was annotated on this model. An empty page says nothing, so show the
  // features its geometry implies instead. The page itself says they were
  // recognised rather than authored, which is the part that matters.
  if (!Object.keys(result.counts).length) {
    try {
      if (!recognise) {
        say(`${result.name}: no PMI — fetching feature recognition…`);
        await painted();
        await fetchRecogniser();
      }
      say(`${result.name}: no PMI — recognising features…`);
      await painted();
      result = JSON.parse(recognise(file.name, bytes));
      busy(false);
      display(result, "recognised features");
      return;
    } catch (err) {
      busy(false);
      say(String(err.message || err).trim().split("\n").pop(), true);
      return;
    }
  }
  busy(false);
  display(result, "annotations");
}

fileEl.addEventListener("change", () => { if (fileEl.files[0]) show(fileEl.files[0]); });
saveEl.addEventListener("click", () => {
  if (!saved) return;
  const a = document.createElement("a");
  a.href = saved.url;
  a.download = saved.name;
  a.click();
});
stepEl.addEventListener("click", () => {
  if (!ap242 || !stepBytes) return;
  const blob = new Blob([stepBytes(ap242.path).toJs()], { type: "model/step" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = ap242.name;
  a.click();
  URL.revokeObjectURL(url);
});
for (const type of ["dragenter", "dragover"]) {
  document.addEventListener(type, e => { e.preventDefault(); dropEl.classList.add("over"); });
}
document.addEventListener("dragleave", () => dropEl.classList.remove("over"));
document.addEventListener("drop", e => {
  e.preventDefault();
  dropEl.classList.remove("over");
  if (e.dataTransfer.files[0]) show(e.dataTransfer.files[0]);
});

// Downloading starts with the page; Pyodide itself is only up once it is parsed.
const kernelWheel = fetchKernel();
addEventListener("DOMContentLoaded", () => boot().catch(err => {
  busy(false);
  say(String(err.message || err), true);
}));
</script>
</body>
</html>
