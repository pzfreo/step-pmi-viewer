<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PART__ — PMI</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f8fa; --ink: #1a1d21; --muted: #707880;
    --line: #d9dee4; --halo: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #14171a; --panel: #1e2226; --ink: #e9ecef; --muted: #98a2ac;
    --line: #333a41; --halo: #14171a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 12.5px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg); overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  #panel {
    position: fixed; top: 10px; right: 10px; width: 216px;
    max-height: calc(100% - 20px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; overflow: hidden; z-index: 10;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  /* The title and the all/none footer stay put; everything between them scrolls,
     so a part with many families is still reachable on a short window. */
  #panel .body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #panel h1 { margin: 0; padding: 9px 11px 7px; font-size: 12px; font-weight: 650;
              border-bottom: 1px solid var(--line); }
  #panel h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .grp { padding: 7px 9px; border-bottom: 1px solid var(--line); }
  .grp > b { display: block; font-size: 10px; text-transform: uppercase;
             letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
  label.row, button.row {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 2.5px 3px; border: 0; background: none; color: inherit;
    font: inherit; cursor: pointer; text-align: left; border-radius: 3px;
  }
  label.row:hover, button.row:hover { background: rgba(127,127,127,.12); }
  .row input[type=checkbox], .row input[type=radio] { margin: 0; accent-color: #2f6fb5; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .row .nm { flex: 1; text-transform: capitalize; }
  .row .ct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .row.off { opacity: .4; }
  #families { overflow-y: auto; }
  input[type=range] { width: 100%; accent-color: #2f6fb5; }
  #foot { padding: 7px 11px; color: var(--muted); font-size: 10.5px;
          display: flex; justify-content: space-between; align-items: center; }
  #foot button { border: 1px solid var(--line); background: none; color: var(--muted);
                 border-radius: 3px; padding: 2px 6px; cursor: pointer; font: inherit; }

  /* PMI: coloured text floating on the model, no chrome -- as CAD PMI is drawn. */
  /* CSS2DRenderer owns .pmi's transform -- it rewrites it every frame to place
     the label on screen. The declutter offset therefore goes on an inner
     element, or it would wipe out the positioning. */
  .pmi {
    position: relative; white-space: nowrap; font-size: 11.5px; font-weight: 600;
    letter-spacing: .01em; pointer-events: auto; cursor: default;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 3px var(--halo), 0 0 3px var(--halo),
                 0 0 2px var(--halo), 0 0 2px var(--halo);
  }
  .pmi-in { display: inline-block; transform: translate(9px, -50%); will-change: transform; }
  .pmi .sub { font-weight: 400; opacity: .8; }
  /* The count a drawing puts in front of a callout covering several identical
     features: "4× ⌀35 THRU", with a leader to each of them. */
  .pmi .times { font-weight: 700; }
  .pmi.echo .pmi-in { visibility: hidden; }
  .pmi .why {
    display: none; position: absolute; left: 0; top: 100%; margin-top: 3px;
    max-width: 250px; white-space: normal; font-weight: 400; font-size: 10.5px;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 7px; text-shadow: none; z-index: 20;
    box-shadow: 0 3px 12px rgba(0,0,0,.16);
  }
  /* A touch screen cannot hover, so the explanation is opened by tapping the
     label instead. Hovering still opens it wherever there is a pointer to hover
     with, which leaves a mouse behaving as it did. */
  @media (hover: hover) { .pmi:hover .why { display: block; } }
  .pmi.asked .why { display: block; }
  .pmi.hidden { display: none; }

  /* Orientation cube and zoom, bottom right, clear of the panel. */
  /* Bottom left: the panel owns the right edge for its whole height.
     Sits above the cube, which the canvas draws in the same corner. */
  #nav { position: fixed; left: 14px; bottom: 106px; display: flex;
         flex-direction: column; align-items: center; gap: 6px; z-index: 9; }
  #zoom, #roll { display: flex; gap: 4px; }
  #zoom button, #roll button {
    width: 26px; height: 24px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel); color: var(--ink); font: 600 13px/1 ui-sans-serif, sans-serif;
    cursor: pointer; padding: 0;
  }
  #zoom button:hover, #roll button:hover { background: var(--line); }
  #zoom button.wide { width: 46px; font-size: 11px; font-weight: 500; }

  /* Label detail. Minimal keeps the value a drawing leads with and drops the
     descriptor, the tolerance and the datum references; none leaves the leader
     and its dot, so a feature is still located without being named. */
  body[data-detail="minimal"] .pmi .sub,
  body[data-detail="minimal"] .pmi .tolpair,
  body[data-detail="minimal"] .pmi .tolsym,
  body[data-detail="minimal"] .fcf span ~ span ~ span { display: none; }
  body[data-detail="minimal"] .fcf span:nth-child(2) { border-right: 0; }
  body[data-detail="none"] .pmi-in { display: none; }

  /* Feature control frame, as ASME Y14.5 draws it: characteristic, tolerance,
     then datum references, each in its own compartment. */
  .fcf { display: inline-flex; border: 1.3px solid currentColor; border-radius: 1px;
         background: var(--bg); text-shadow: none; overflow: hidden; }
  .fcf span { padding: 1px 6px; border-right: 1.3px solid currentColor;
              display: inline-flex; align-items: center; justify-content: center;
              min-width: 20px; }
  .fcf span:last-child { border-right: 0; }
  .fcf .sym { font-size: 13px; line-height: 1; }
  /* Datum feature symbol: a boxed letter. */
  .datum { display: inline-flex; border: 1.3px solid currentColor; border-radius: 1px;
           background: var(--bg); text-shadow: none; padding: 1px 7px; min-width: 20px;
           justify-content: center; }
  /* Tolerances: a symmetric one sits inline, an asymmetric pair or a pair of
     limits stacks, as on a drawing. */
  .tolpair { display: inline-flex; flex-direction: column; align-items: flex-start;
             font-size: 8.5px; line-height: 1.12; font-weight: 500; margin-left: 2px;
             vertical-align: middle; }
  .tolsym { font-weight: 500; font-size: 10.5px; margin-left: 2px; }

  /* A phone has no room for a 216px panel pinned over the model: it covered
     better than half the width and all of the height, and the part was left
     peering out from behind it. Narrow enough, the panel slides off the right
     edge and a key in the far corner brings it back, so the model has the
     screen to itself until the panel is actually wanted. */
  #grab { display: none; }
  @media (max-width: 640px) {
    #panel {
      /* Held to the top half even when it has more to show: the point of a
         family switch is watching the part change as it is thrown. */
      left: 10px; width: auto; max-height: min(52%, calc(100% - 92px));
      transition: transform .22s ease;
    }
    body:not(.panelled) #panel { transform: translateX(calc(100% + 12px)); }
    #grab {
      display: grid; place-items: center; position: fixed; right: 14px; bottom: 14px;
      width: 46px; height: 46px; border-radius: 50%; z-index: 11;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      font: 400 18px/1 ui-sans-serif, sans-serif; cursor: pointer; padding: 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.14);
    }
    #grab::before { content: "\2261"; }
    body.panelled #grab::before { content: "\00d7"; font-size: 21px; }
  }

  /* A fingertip is not a mouse pointer: the zoom keys were 26 by 24, which is
     half of what a touch target wants to be. */
  @media (pointer: coarse) {
    #zoom button, #roll button { width: 42px; height: 40px; font-size: 17px; }
    #zoom button.wide { width: 62px; font-size: 13px; }
    label.row, button.row { padding: 7px 3px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="nav">
  <div id="roll">
    <button id="rollLeft" title="Roll a quarter turn anticlockwise">↺</button>
    <button id="rollRight" title="Roll a quarter turn clockwise">↻</button>
  </div>
  <div id="zoom">
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomFit" class="wide" title="Fit the part">fit</button>
    <button id="zoomHome" title="The opening view">⌂</button>
  </div>
</div>
<aside id="panel">
  <h1>__PART__<small id="sub"></small></h1>

  <div class="body">
  <div class="grp">
    <b>Display</b>
    <label class="row"><input type="checkbox" id="cbPart" checked><span class="nm">Part geometry</span></label>
    <label class="row"><input type="checkbox" id="cbEdges" checked><span class="nm">Edges</span></label>
    <label class="row"><input type="checkbox" id="cbColour" checked><span class="nm">Feature colours</span></label>
    <label class="row"><input type="checkbox" id="cbBox"><span class="nm">Bounding box</span></label>
    <label class="row"><input type="checkbox" id="cbOrigin"><span class="nm">Origin</span></label>
    <label class="row"><input type="checkbox" id="cbDark"><span class="nm">Dark background</span></label>
    <label class="row"><input type="checkbox" id="cbFacing" checked><span class="nm">Hide far side</span></label>
    <label class="row"><input type="checkbox" id="cbRepeat" checked><span class="nm">Group repeats</span></label>
  </div>

  <div class="grp" id="presetGroup" hidden>
    <b>Show</b>
    <label class="row"><input type="radio" name="preset" value="semantic" checked><span class="nm">Semantic PMI</span></label>
    <label class="row"><input type="radio" name="preset" value="drawn"><span class="nm">As drawn</span></label>
    <label class="row"><input type="radio" name="preset" value="both"><span class="nm">Both</span></label>
  </div>

  <div class="grp">
    <b>Label detail</b>
    <label class="row"><input type="radio" name="detail" value="full" checked><span class="nm">Full</span></label>
    <label class="row"><input type="radio" name="detail" value="minimal"><span class="nm">Minimal</span></label>
    <label class="row"><input type="radio" name="detail" value="none"><span class="nm">None</span></label>
  </div>

  <div class="grp">
    <b>Transparency</b>
    <input type="range" id="alpha" min="0" max="90" value="85">
  </div>

  <div class="grp" id="viewsGroup" hidden>
    <b>Saved views</b>
    <div id="views"></div>
  </div>

  <div class="grp" style="padding-bottom:3px"><b>Annotations</b></div>
  <div id="groups"></div>
  </div>
  <div id="foot"><span id="shown"></span>
    <span><button id="all">all</button> <button id="none">none</button></span>
  </div>
</aside>
<button id="grab" aria-label="Show or hide the panel"></button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const DATA = __DATA__;
const GROUP_COLOUR = __COLOURS__;
const scene = new THREE.Scene();
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const overlay = new CSS2DRenderer();
overlay.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none';
stage.appendChild(overlay.domElement);

const d = DATA.bbox.diagonal;
const c = DATA.bbox.min.map((v, i) => (v + DATA.bbox.max[i]) / 2);
const camera = new THREE.PerspectiveCamera(36, 1, d / 500, d * 60);
// The three-quarter view the page opens at. No face of the cube is this, and
// hunting for it by hand after a tumble is a chore, so the home key puts the
// camera back exactly here -- which is why it is a function and not a literal.
//
// It stands off by a fixed share of the diagonal, which suits a window wider
// than it is tall. A phone held upright is not: 36 degrees across the height is
// much less than that across the width, so the part arrived cropped off both
// edges. Stand further off by however much narrower the window is.
const HOME = [0.8, -1.0, 0.62];
// Roughly, for now: how far off it belongs depends on the shape of the window,
// which is not known until resize has run, and home() settles it then.
camera.position.fromArray(c).addScaledVector(new THREE.Vector3(...HOME), d);
camera.up.set(0, 0, 1);
// On the stage, not the label overlay: the overlay is pointer-events:none, so it
// never sees a pointerdown except one that started on a label, and dragging the
// part or the cube did nothing at all.
const controls = new OrbitControls(camera, stage);
controls.target.set(...c); controls.enableDamping = true; controls.dampingFactor = 0.09;
// OrbitControls keeps "up" up, which costs the part its roll: the polar angle
// stops dead at the top and the bottom, so a drag that means "keep turning it
// over" hits a wall halfway round. Its pan and its zoom are worth keeping, so
// only the rotation is taken over, below.
controls.enableRotate = false;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9099, 2.5));
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(1, -1.3, 1.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-1.2, 0.8, -0.3);
scene.add(key, fill);

// --- part ---------------------------------------------------------------
const partGroup = new THREE.Group(); scene.add(partGroup);
const edgeGroup = new THREE.Group(); edgeGroup.visible = false; scene.add(edgeGroup);
const meshes = [], original = new Map();
const PLAIN = new THREE.Color(0xc9ced4);

const bin = Uint8Array.from(atob(DATA.glb), ch => ch.charCodeAt(0));
new GLTFLoader().parse(bin.buffer, '', gltf => {
  // Fit whatever arrives onto the coordinate space the annotations use: a glTF
  // written from a document that knows its units comes back in metres.
  const got = new THREE.Box3().setFromObject(gltf.scene);
  const want = new THREE.Box3(new THREE.Vector3(...DATA.bbox.min), new THREE.Vector3(...DATA.bbox.max));
  const gs = got.getSize(new THREE.Vector3()), ws = want.getSize(new THREE.Vector3());
  const k = Math.max(gs.x, gs.y, gs.z) > 1e-9 ? Math.max(ws.x, ws.y, ws.z) / Math.max(gs.x, gs.y, gs.z) : 1;
  if (Math.abs(k - 1) > 1e-3) gltf.scene.scale.setScalar(k);
  gltf.scene.updateMatrixWorld(true);
  const now = new THREE.Box3().setFromObject(gltf.scene);
  gltf.scene.position.add(want.getCenter(new THREE.Vector3()).sub(now.getCenter(new THREE.Vector3())));
  partGroup.add(gltf.scene);

  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.material = o.material.clone();
    o.material.side = THREE.DoubleSide;
    o.material.metalness = 0.04; o.material.roughness = 0.6;
    original.set(o, o.material.color.clone());
    meshes.push(o);
    const eg = new THREE.EdgesGeometry(o.geometry, 25);
    const line = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x4a5058 }));
    o.updateMatrixWorld(true); line.applyMatrix4(o.matrixWorld);
    edgeGroup.add(line);
  });
  applyLook();
});

// --- helpers ------------------------------------------------------------
const boxHelper = new THREE.Box3Helper(
  new THREE.Box3(new THREE.Vector3(...DATA.bbox.min), new THREE.Vector3(...DATA.bbox.max)),
  0x9aa3ad);
boxHelper.visible = false; scene.add(boxHelper);
const axes = new THREE.AxesHelper(d * 0.18); axes.visible = false; scene.add(axes);

// --- PMI ----------------------------------------------------------------
const byGroup = new Map();
const placedLabels = [];

// Occlusion state, declared here because applyLook resets it and runs during
// setup: a `let` further down the file is in its temporal dead zone then, and
// reading it throws before the render loop is ever reached -- a blank page with
// a working panel beside it.
const occluder = new THREE.Raycaster();
let still = 0;
const lastEye = new THREE.Vector3(Infinity, 0, 0);
const leaderMaterials = [];
//: Leader width in pixels. Thin enough not to obscure the part, thick enough to
//: follow across a busy view.
const LEADER_PX = 2.2;
for (const a of DATA.labels) {
  const el = document.createElement('div');
  el.className = 'pmi'; el.style.color = GROUP_COLOUR[a.group] || '#555';
  const why = a.detail ? `<span class="why">${a.detail}</span>` : '';
  let inner;
  if (a.kind === 'frame') {
    inner = `<span class="fcf">` +
      a.cells.map((c, i) => `<span${i === 0 ? ' class="sym"' : ''}>${c}</span>`).join('') +
      `</span>${why}`;
  } else if (a.kind === 'datum') {
    inner = `<span class="datum">${a.cells[0]}</span>${why}`;
  } else {
    let tol = '';
    if (a.tolerance && a.tolerance.style === 'symmetric') {
      tol = `<span class="tolsym">${a.tolerance.upper}</span>`;
    } else if (a.tolerance) {
      tol = `<span class="tolpair"><span>${a.tolerance.upper}</span>` +
            `<span>${a.tolerance.lower}</span></span>`;
    }
    inner = `${a.cells[0]}${tol}` +
      (a.cells.length > 1 ? ` <span class="sub">${a.cells.slice(1).join(' ')}</span>` : '') + why;
  }
  el.innerHTML = `<span class="pmi-in"><span class="times"></span>${inner}</span>`;
  const tag = new CSS2DObject(el);
  const near = new THREE.Vector3(...(a.origin));
  tag.position.copy(near); scene.add(tag);

  const tint = new THREE.Color(GROUP_COLOUR[a.group] || '#555');
  const tip = new THREE.Vector3(...a.anchor);

  // WebGL draws every THREE.Line one pixel wide whatever linewidth says, so a
  // leader that should read at a glance is built from Line2 instead.
  const mat = new LineMaterial({
    color: tint.getHex(), linewidth: LEADER_PX, worldUnits: false,
    dashed: false, alphaToCoverage: true,
  });
  mat.resolution.set(innerWidth, innerHeight);
  leaderMaterials.push(mat);
  // Through any bends the annotation asked for, so a leader can meet the surface
  // square rather than arriving at the angle the label happens to sit at.
  const path = [near, ...(a.via || []).map(v => new THREE.Vector3(...v)), tip];
  const geom = new LineGeometry();
  geom.setPositions(path.flatMap(p => [p.x, p.y, p.z]));
  const line = new Line2(geom, mat);
  line.computeLineDistances();
  scene.add(line);

  // An arrowhead where the leader lands, as a drawing puts one. A leader of no
  // length has no direction to point along, so it gets no head and no line.
  const stub = tip.distanceTo(path[path.length - 2]) < d * 1e-4;
  const dot = new THREE.Mesh(
    new THREE.ConeGeometry(d * 0.006, d * 0.022, 12),
    new THREE.MeshBasicMaterial({ color: tint }));
  const along = tip.clone().sub(path[path.length - 2]).normalize();
  dot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), along);
  dot.position.copy(tip).addScaledVector(along, -d * 0.011);
  dot.visible = line.visible = !stub;
  scene.add(dot);

  if (!byGroup.has(a.group)) byGroup.set(a.group, { colour: GROUP_COLOUR[a.group] || '#555', items: [] });
  byGroup.get(a.group).items.push({ el, line, dot });
  placedLabels.push({
    el, tag, line, dot, stub, world: near, inner: el.firstElementChild,
    times: el.querySelector('.times'),
    // Identical text on the same kind of annotation is the same callout.
    repeat: `${a.group}\u0000${a.cells.join(' ')}\u0000` +
            (a.tolerance ? JSON.stringify(a.tolerance) : ''),
    out: near.clone().sub(new THREE.Vector3(...a.anchor)).normalize(),
    tip: tip.clone(),
  });
}

// --- drawn PMI ----------------------------------------------------------
// The line work an author drew: frames, leaders and the glyphs of the text
// itself. Rendered as geometry because that is what it is -- there is no value
// to set in HTML, and in a file carrying only graphic PMI this is the whole
// annotation.
const graphicGroup = new THREE.Group();
graphicGroup.visible = false;
scene.add(graphicGroup);

for (const g of (DATA.graphics || [])) {
  const positions = [];
  for (const line of g.polylines) {
    for (let i = 0; i + 1 < line.length; i++) {
      positions.push(...line[i], ...line[i + 1]);
    }
  }
  const tint = new THREE.Color(GROUP_COLOUR[g.group] || '#555');
  if (positions.length) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    graphicGroup.add(new THREE.LineSegments(
      geometry, new THREE.LineBasicMaterial({ color: tint })));
  }
  // The filled parts -- the glyphs of the text, and arrowheads. Unlit, so they
  // read as ink at any angle rather than shading like part of the solid.
  if (g.indices && g.indices.length) {
    const filled = new THREE.BufferGeometry();
    filled.setAttribute('position', new THREE.Float32BufferAttribute(g.vertices, 3));
    filled.setIndex(g.indices);
    graphicGroup.add(new THREE.Mesh(filled, new THREE.MeshBasicMaterial({
      color: tint, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    })));
  }
}
if (graphicGroup.children.length) document.getElementById('presetGroup').hidden = false;

// Semantic and drawn PMI say the same things in different ways, so showing both
// doubles every callout. The preset picks one: "as drawn" is what the author's
// CAD system put on the model, witness lines and all, which is what a drawing
// of the part shows.
function drawnWanted() {
  const preset = document.querySelector('input[name=preset]:checked');
  return !!preset && preset.value !== 'semantic';
}

function applyPreset(value) {
  const text = value === 'drawn' ? 'none' : 'full';
  for (const radio of document.querySelectorAll('input[name=detail]')) {
    radio.checked = radio.value === text;
  }
  applyLook();
}

// --- controls -----------------------------------------------------------
// How many features each distinct callout covers, for the "n×" prefix.
const repeatCount = new Map();
for (const L of placedLabels) {
  repeatCount.set(L.repeat, (repeatCount.get(L.repeat) || 0) + 1);
}

// A saved view is the author's grouping of the PMI: which callouts belong
// together, and where to stand to read them. Null means show everything.
let activeView = null;

const hidden = new Set();
const list = document.getElementById('groups');
const shown = document.getElementById('shown');
const total = DATA.labels.length;
const $ = id => document.getElementById(id);

function applyView() {
  const view = activeView === null ? null : DATA.views[activeView];
  const shown = view ? new Set(view.shows) : null;
  placedLabels.forEach((L, i) => { L.outOfView = shown !== null && !shown.has(i); });
  if (view && view.direction) {
    // Stand where the view says to stand, looking at the part.
    const d = DATA.bbox.diagonal;
    const centre = new THREE.Vector3(...DATA.bbox.min)
      .add(new THREE.Vector3(...DATA.bbox.max)).multiplyScalar(0.5);
    const from = new THREE.Vector3(...view.direction).normalize().multiplyScalar(-d);
    camera.position.copy(centre).sub(from);
    if (view.up) camera.up.set(...view.up);
    controls.target.copy(centre);
    controls.update();
  }
  applyPmi();
}

function applyPmi() {
  for (const [fam, g] of byGroup) {
    const off = hidden.has(fam);
    for (const it of g.items) {
      it.el.classList.toggle('hidden', off);
      if (off) { it.line.visible = false; it.dot.visible = false; }
    }
  }
  for (const r of list.children) r.classList.toggle('off', hidden.has(r.dataset.fam));
  const n = total - [...hidden].reduce((s, f) => s + byGroup.get(f).items.length, 0);
  shown.textContent = `${n} of ${total}`;
}

function applyLook() {
  const a = $('alpha').valueAsNumber / 100;
  const colour = $('cbColour').checked;
  for (const m of meshes) {
    m.material.color.copy(colour ? original.get(m) : PLAIN);
    m.material.transparent = a > 0;
    m.material.opacity = 1 - a;
    m.material.depthWrite = a === 0;
    m.material.needsUpdate = true;
  }
  partGroup.visible = $('cbPart').checked;
  edgeGroup.visible = $('cbEdges').checked;
  boxHelper.visible = $('cbBox').checked;
  graphicGroup.visible = drawnWanted();
  axes.visible = $('cbOrigin').checked;
  document.documentElement.dataset.theme = $('cbDark').checked ? 'dark' : 'light';
  const detail = document.querySelector('input[name=detail]:checked');
  document.body.dataset.detail = detail ? detail.value : 'full';
  // Hiding the part or turning it see-through changes what is in the way.
  still = 0;
}

// With no label to point at, a leader points at nothing -- and over drawn PMI it
// doubles the author's own leaders. So leaders follow the text.
function leadersWanted() {
  const detail = document.querySelector('input[name=detail]:checked');
  return !detail || detail.value !== 'none';
}

for (const [fam, g] of [...byGroup].sort((x, y) => y[1].items.length - x[1].items.length)) {
  const b = document.createElement('button');
  b.className = 'row'; b.dataset.fam = fam;
  b.innerHTML = `<span class="sw" style="background:${g.colour}"></span>` +
                `<span class="nm">${fam.replace(/_/g, ' ')}</span>` +
                `<span class="ct">${g.items.length}</span>`;
  b.onclick = () => { hidden.has(fam) ? hidden.delete(fam) : hidden.add(fam); applyPmi(); };
  list.appendChild(b);
}
$('all').onclick = () => { hidden.clear(); applyPmi(); };
$('none').onclick = () => { byGroup.forEach((_, f) => hidden.add(f)); applyPmi(); };
for (const id of ['cbPart', 'cbEdges', 'cbColour', 'cbBox', 'cbOrigin', 'cbDark',
                  'cbFacing', 'cbRepeat'])
  $(id).onchange = applyLook;
$('alpha').oninput = applyLook;
for (const radio of document.querySelectorAll('input[name=detail]'))
  radio.onchange = applyLook;
for (const radio of document.querySelectorAll('input[name=preset]'))
  radio.onchange = () => applyPreset(radio.value);
if (DATA.views && DATA.views.length) {
  const box = document.getElementById('views');
  const choices = [{ name: 'All', index: null }].concat(
    DATA.views.map((v, i) => ({ name: `${v.name} (${v.shows.length})`, index: i })));
  for (const choice of choices) {
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML = `<input type="radio" name="view"${choice.index === null ? ' checked' : ''}>` +
                    `<span class="nm">${choice.name}</span>`;
    row.querySelector('input').onchange = () => { activeView = choice.index; applyView(); };
    box.appendChild(row);
  }
  document.getElementById('viewsGroup').hidden = false;
}

$('sub').textContent = (DATA.origin ? DATA.origin + ' · ' : '') +
                       `${total} annotations · ${byGroup.size} kinds`;
applyView(); applyLook();

// --- orientation cube ---------------------------------------------------
// A cube in the corner showing which way the part is facing, whose faces snap
// the camera to a standard view. Drawn in its own scene over the main one.
const CUBE_PX = 84, CUBE_EDGE = 14;
const cubeScene = new THREE.Scene();
const cubeCamera = new THREE.OrthographicCamera(-1.5, 1.5, 1.5, -1.5, 0.1, 20);
cubeCamera.position.set(0, 0, 6);

function faceTexture(text) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#e9edf1';
  g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#98a2ad'; g.lineWidth = 5;
  g.strokeRect(2.5, 2.5, 123, 123);
  g.fillStyle = '#2b3138';
  g.font = '600 26px ui-sans-serif, -apple-system, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 64, 66);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// BoxGeometry orders its materials +X, -X, +Y, -Y, +Z, -Z. Z is up here.
const CUBE_FACES = [
  ['RIGHT', [1, 0, 0]], ['LEFT', [-1, 0, 0]],
  ['BACK', [0, 1, 0]], ['FRONT', [0, -1, 0]],
  ['TOP', [0, 0, 1]], ['BOTTOM', [0, 0, -1]],
];
const CUBE_SIDE = 1.7;
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(CUBE_SIDE, CUBE_SIDE, CUBE_SIDE),
  CUBE_FACES.map(([name]) => new THREE.MeshBasicMaterial({ map: faceTexture(name) })));
cubeScene.add(cube);

// A cube that does not light up under the pointer keeps its edges and corners a
// secret: nothing about six flat faces says the rim between them can be asked
// for too. The patch is a child of the cube, so it turns with it, and it is
// shaped from the same direction the press would return -- a square in the
// middle of a face, a strip along an edge, a nub at a corner.
const HALF = CUBE_SIDE / 2;
const highlight = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({
    color: 0x2f6fb5, transparent: true, opacity: 0.3, depthWrite: false,
  }));
highlight.visible = false;
cube.add(highlight);

function markCube(direction) {
  highlight.visible = Boolean(direction);
  if (!direction) return;
  for (let axis = 0; axis < 3; axis++) {
    const out = direction[axis];
    // Out to a hair beyond the surface, or the face's own texture wins the
    // depth test and the patch flickers through it.
    const size = out ? (1.02 - CUBE_EDGE_BAND) * HALF : 2 * CUBE_EDGE_BAND * HALF;
    highlight.scale.setComponent(axis, size);
    highlight.position.setComponent(
      axis, out ? out * ((1.02 + CUBE_EDGE_BAND) / 2) * HALF : 0);
  }
}

const centreOf = () => new THREE.Vector3(...DATA.bbox.min)
  .add(new THREE.Vector3(...DATA.bbox.max)).multiplyScalar(0.5);

// Snapping used to cut straight to the new view, and a cut loses the reader:
// with nothing moving in between there is no telling which way the part turned,
// only that it is suddenly showing a different side. It turns there instead.
//
// The orientation is carried as a quaternion rather than as an up vector: going
// home from upside down flips up end for end, and a vector interpolated through
// that passes through nothing at all.
const FLIGHT_MS = 340;
const pose = new THREE.Object3D();
let flight = null;

function poseAt(position, up, target) {
  pose.up.copy(up);
  pose.position.copy(position);
  pose.lookAt(target);
  return pose.quaternion.clone();
}

function flyTo(position, up, target, now) {
  if (now) {
    camera.up.copy(up);
    camera.position.copy(position);
    controls.target.copy(target);
    camera.lookAt(target);
    controls.update();
    flight = null;
    return;
  }
  flight = {
    at: performance.now(),
    fromPosition: camera.position.clone(), toPosition: position.clone(),
    fromTarget: controls.target.clone(), toTarget: target.clone(),
    fromQuaternion: camera.quaternion.clone(),
    toQuaternion: poseAt(position, up, target),
    up: up.clone(),
  };
}

function advanceFlight() {
  if (!flight) return;
  const part = Math.min(1, (performance.now() - flight.at) / FLIGHT_MS);
  // Eased both ends, so it leaves and arrives without a jolt.
  const eased = part < 0.5 ? 2 * part * part : 1 - 2 * (1 - part) * (1 - part);
  controls.target.lerpVectors(flight.fromTarget, flight.toTarget, eased);
  camera.position.lerpVectors(flight.fromPosition, flight.toPosition, eased);
  camera.quaternion.slerpQuaternions(flight.fromQuaternion, flight.toQuaternion, eased);
  if (part < 1) return;
  // Landed: leave the camera stated the ordinary way, or the next orbit reads
  // an up vector that no longer agrees with where it is pointing.
  camera.up.copy(flight.up);
  camera.position.copy(flight.toPosition);
  camera.lookAt(controls.target);
  flight = null;
}

function lookFrom(direction) {
  const centre = centreOf();
  const away = camera.position.distanceTo(controls.target) || DATA.bbox.diagonal;
  // A corner of the cube arrives as [1, 1, 1], which is root-three long: taken
  // as given it would stand the camera that much further off, so the length is
  // dropped and only the heading kept.
  const heading = new THREE.Vector3(...direction).normalize();
  // Looking straight down Z, "up" cannot also be Z; use Y, as a plan view does.
  const up = new THREE.Vector3(...(Math.abs(heading.z) > 0.9 ? [0, 1, 0] : [0, 0, 1]));
  flyTo(centre.clone().addScaledVector(heading, away), up, centre);

}

// A press on the cube is only a snap if it stays put. Swallowing it outright
// would stop a drag there orbiting the part, which is what a cube invites.
const cubeRay = new THREE.Raycaster();
let pressedOnCube = null;

// Where on the cube a press landed, as a direction to stand in. Not just the
// six faces: a real view cube gives its edges and its corners too, and those
// are the views a part is usually read from -- the page's own opening view is a
// corner one, and by face alone there was no way back to anything like it.
// Which is which comes from where in the face the press landed, as a fraction
// of the way out to the rim: the middle is the face, a band is the edge it
// runs along, and the corners are where two bands cross.
const CUBE_EDGE_BAND = 0.62;

function faceAt(x, y) {
  const left = CUBE_EDGE, top = innerHeight - CUBE_EDGE - CUBE_PX;
  if (x < left || x > left + CUBE_PX || y < top || y > top + CUBE_PX) return null;
  cubeRay.setFromCamera(new THREE.Vector2(
    ((x - left) / CUBE_PX) * 2 - 1, -((y - top) / CUBE_PX) * 2 + 1), cubeCamera);
  const hit = cubeRay.intersectObject(cube, false)[0];
  if (!hit) return null;
  const local = cube.worldToLocal(hit.point.clone()).multiplyScalar(2 / CUBE_SIDE);
  const direction = [local.x, local.y, local.z].map(
    v => (Math.abs(v) > CUBE_EDGE_BAND ? Math.sign(v) : 0));
  // A press dead in the middle of a face rounds to nothing on every axis; the
  // face it struck is the answer there.
  return direction.some(Boolean) ? direction : CUBE_FACES[hit.face.materialIndex][1];
}

stage.addEventListener('pointerdown', event => {
  pressedOnCube = faceAt(event.clientX, event.clientY) &&
                  { x: event.clientX, y: event.clientY };
}, true);

// --- tumbling ------------------------------------------------------------
// Turning the part with no fixed up, so a drag can carry it over the top and
// keep going rather than stopping at the pole. The camera's own axes do the
// turning -- its right for the vertical drag, its up for the horizontal -- and
// its up is carried round with it, which is the whole difference from an orbit.
const TURN = 2 * Math.PI;   // a full turn across the shorter side of the window
const tumbleQ = new THREE.Quaternion(), tumbleAxis = new THREE.Vector3();
const touching = new Set();
let tumbling = null;

stage.addEventListener('pointerdown', event => {
  touching.add(event.pointerId);
  // A second finger means a pinch, which is OrbitControls' to deal with: the
  // first finger is still the primary one, and left to itself it would spin the
  // part while the other two were only trying to zoom it.
  if (touching.size > 1) { tumbling = null; return; }
  if (!event.isPrimary || event.button !== 0) return;
  // A hand on the part outranks a flight it is still in the middle of.
  flight = null;
  tumbling = { x: event.clientX, y: event.clientY, id: event.pointerId };
});

// The cube lights up wherever the pointer is over it, and goes dark while the
// part is being turned by hand -- there is nothing to press at that moment.
stage.addEventListener('pointermove', event => {
  markCube(tumbling ? null : faceAt(event.clientX, event.clientY));
});
stage.addEventListener('pointerleave', () => markCube(null));

addEventListener('pointermove', event => {
  if (!tumbling || event.pointerId !== tumbling.id) return;
  const span = Math.min(innerWidth, innerHeight);
  const dx = ((event.clientX - tumbling.x) / span) * TURN;
  const dy = ((event.clientY - tumbling.y) / span) * TURN;
  tumbling.x = event.clientX;
  tumbling.y = event.clientY;
  tumbleQ.setFromAxisAngle(tumbleAxis.setFromMatrixColumn(camera.matrix, 1), -dx);
  tumbleQ.multiply(new THREE.Quaternion().setFromAxisAngle(
    tumbleAxis.setFromMatrixColumn(camera.matrix, 0), -dy));
  const offset = camera.position.clone().sub(controls.target).applyQuaternion(tumbleQ);
  camera.position.copy(controls.target).add(offset);
  camera.up.applyQuaternion(tumbleQ);
  camera.lookAt(controls.target);
});

for (const end of ['pointerup', 'pointercancel'])
  addEventListener(end, event => {
    touching.delete(event.pointerId);
    if (tumbling && event.pointerId === tumbling.id) tumbling = null;
  });

// --- reaching a label without a pointer to hover with ---------------------
// The explanation hangs off :hover, which a touch screen has none of. A tap on
// the label opens it, and a tap anywhere else closes it again. One at a time:
// they are wide, and two open at once would be a pile of text over the part.
const noHover = matchMedia('(hover: none)');
addEventListener('click', event => {
  // Only where there is nothing to hover with. A mouse already opens the
  // explanation by hovering, and a click that pinned one open would be a
  // behaviour it did not have before.
  if (!noHover.matches) return;
  const label = event.target.closest?.('.pmi');
  for (const open of document.querySelectorAll('.pmi.asked')) {
    if (open !== label) open.classList.remove('asked');
  }
  if (label && label.querySelector('.why')) label.classList.toggle('asked');
});

// --- the panel, where the screen is too narrow to keep it open ------------
grab.addEventListener('click', () => document.body.classList.toggle('panelled'));

addEventListener('pointerup', event => {
  const press = pressedOnCube;
  pressedOnCube = null;
  if (!press) return;
  // The cube has turned under a drag, so re-read the face where the press began.
  if (Math.hypot(event.clientX - press.x, event.clientY - press.y) > 4) return;
  const face = faceAt(press.x, press.y);
  if (face) lookFrom(face);
});

// --- zoom ---------------------------------------------------------------
function dolly(factor) {
  const offset = camera.position.clone().sub(controls.target);
  const length = Math.max(DATA.bbox.diagonal * 0.02, offset.length() * factor);
  camera.position.copy(controls.target).add(offset.setLength(length));
  controls.update();
}

// How far back the whole part is in view, looking along ``heading`` with
// ``up`` overhead. The old answer was the largest side of the bounding box
// times a fudge factor, which is a guess at this and a loose one: it stood so
// far off that the part took barely half the window, and less than that again
// on a phone, where standing off by the aspect ratio on top of the fudge put
// the part at a third of the width.
//
// The corners of the box are what actually has to be in view. Measured along
// the two axes of the screen they give the half-width and half-height the part
// really needs from this angle, and the distance follows from the field of view.
const FIT_AIR = 1.06;   // a little air around it, so nothing touches the edge

function standoff(heading, up) {
  const across = new THREE.Vector3().crossVectors(heading, up).normalize();
  const over = new THREE.Vector3().crossVectors(across, heading).normalize();
  const centre = centreOf();
  const low = new THREE.Vector3(...DATA.bbox.min), high = new THREE.Vector3(...DATA.bbox.max);
  let halfAcross = 0, halfOver = 0;
  for (let corner = 0; corner < 8; corner++) {
    const at = new THREE.Vector3(
      corner & 1 ? high.x : low.x,
      corner & 2 ? high.y : low.y,
      corner & 4 ? high.z : low.z).sub(centre);
    halfAcross = Math.max(halfAcross, Math.abs(at.dot(across)));
    halfOver = Math.max(halfOver, Math.abs(at.dot(over)));
  }
  // The panel sits over the right of the canvas, and the frustum is already
  // shifted to centre the part in what it leaves; the width to fit into is
  // that clear strip, not the whole window.
  const clear = Math.max(innerWidth - panelRoom(), 1);
  const tanOver = Math.tan((camera.fov * Math.PI) / 360);
  const tanAcross = tanOver * (clear / innerHeight);
  return Math.max(halfOver / tanOver, halfAcross / tanAcross) * FIT_AIR;
}

function fit() {
  const centre = centreOf();
  const heading = camera.position.clone().sub(controls.target).normalize();
  const over = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  flyTo(centre.clone().addScaledVector(heading, standoff(heading, over)), over, centre);
}

$('zoomIn').onclick = () => dolly(1 / 1.25);
$('zoomOut').onclick = () => dolly(1.25);
$('zoomFit').onclick = fit;
// Standing back where the page opened, framing and all: fit() stands further
// off than the opening view, so going home through it arrived correct but
// small. A tumble has no landmarks in it, and by the faces of the cube alone
// there was no way back to a three-quarter view at all.
// Home is the opening three-quarter view, framed to the window it is in: a
// fixed standoff put the part at a third of the width of a phone held upright,
// and the reader then had to zoom every time they came back to it.
function home(now) {
  const heading = new THREE.Vector3(...HOME).normalize();
  const up = new THREE.Vector3(0, 0, 1);
  const centre = centreOf();
  flyTo(centre.clone().addScaledVector(heading, standoff(heading, up)), up, centre, now);
}
$('zoomHome').onclick = () => home(false);

// A quarter turn about the line of sight. Square onto a face, nothing else
// turns the part in the plane of the screen: an orbit takes the long way round
// and a tumble cannot do it at all, since both move where you stand rather than
// which way up you are standing.
function roll(quarters) {
  const heading = camera.position.clone().sub(controls.target).normalize();
  const over = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1)
    .applyAxisAngle(heading, (quarters * Math.PI) / 2);
  flyTo(camera.position.clone(), over, controls.target.clone());
}
$('rollLeft').onclick = () => roll(-1);
$('rollRight').onclick = () => roll(1);

// --- loop ---------------------------------------------------------------
// The panel covers the right of the canvas, so the centre of the window is not
// the centre of what you can see. Shift the frustum left by half the panel to
// put the part in the middle of the clear area -- and keep the canvas full
// width, so the labels, which project through the same matrix, still line up.
const PANEL_PX = 236;

// Except on a narrow screen, where it slides off the model rather than sitting
// beside it: it covers nothing when closed, so shifting the part away from it
// only pushed the part off the left edge.
const panelRoom = () => (innerWidth <= 640 ? 0 : Math.min(PANEL_PX, innerWidth * 0.35));

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.setViewOffset(w, h, panelRoom() / 2, 0, w, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h); overlay.setSize(w, h);
  for (const m of leaderMaterials) m.resolution.set(w, h);
}
addEventListener('resize', resize); resize();
// Now that the window's shape is known, stand where the part fills it.
home(true);
// Labels sit beside their feature, so on a crowded part they collide on screen.
// Push each one vertically off whatever is already placed, nearest the camera
// first, so the label in front keeps its position and the one behind moves.
const proj = new THREE.Vector3(), toCam = new THREE.Vector3();
function declutter() {
  const w = innerWidth, h = innerHeight;
  const cull = document.getElementById('cbFacing').checked;
  const leaders = leadersWanted();
  let rows = [];
  for (const L of placedLabels) {
    if (!leaders) { L.line.visible = false; L.dot.visible = false; }
    if (L.el.classList.contains('hidden') || L.outOfView) {
      L.inner.style.transform = '';
      if (L.outOfView) { L.line.visible = false; L.dot.visible = false; }
      L.el.style.visibility = L.outOfView ? 'hidden' : L.el.style.visibility;
      continue;
    }
    if (!leaders) { L.el.style.visibility = ''; continue; }

    // A feature pointing away from the camera is on the far side of the part.
    // Its label would otherwise float over geometry it does not belong to,
    // and on a part with many features that is most of the clutter. A label with
    // no leader has no direction to be facing, so it is never culled that way.
    // The threshold hides only what is genuinely turned away: at 0.12 it also
    // took everything within a few degrees of edge-on, which on a round part is
    // most of what you are looking at.
    const away = cull && (L.buried ||
      (!L.stub &&
       toCam.subVectors(camera.position, L.world).normalize().dot(L.out) < -0.25));
    L.line.visible = leaders && !away && !L.stub;
    L.dot.visible = leaders && !away && !L.stub;
    if (away) { L.el.style.visibility = 'hidden'; continue; }

    proj.copy(L.world).project(camera);
    if (proj.z > 1) { L.el.style.visibility = 'hidden'; continue; }
    L.el.style.visibility = '';
    rows.push({
      L, depth: proj.z,
      x: (proj.x * 0.5 + 0.5) * w, y: (-proj.y * 0.5 + 0.5) * h,
      bw: L.inner.offsetWidth || 90, bh: (L.inner.offsetHeight || 15) + 3,
    });
  }
  rows.sort((a, b) => a.depth - b.depth);

  // One callout per distinct text, spoken by whichever instance is nearest the
  // camera; the rest keep their leader and arrowhead but say nothing. That is
  // how a drawing handles repeats, and it is the difference between a readable
  // part and sixty overlapping labels.
  if (document.getElementById('cbRepeat').checked) {
    const spokenBy = new Map();
    for (const r of rows) {
      if (!spokenBy.has(r.L.repeat)) spokenBy.set(r.L.repeat, r.L);
    }
    for (const L of placedLabels) {
      const speaker = spokenBy.get(L.repeat);
      const echo = speaker !== undefined && speaker !== L;
      L.el.classList.toggle('echo', echo);
      L.times.textContent = speaker === L && repeatCount.get(L.repeat) > 1
        ? `${repeatCount.get(L.repeat)}\u00d7 ` : '';
      // An echo's leader goes too: a drawing points once and says how many,
      // rather than drawing eighteen leaders to eighteen identical blends.
      if (echo || !leaders) { L.line.visible = false; L.dot.visible = false; }
    }
    rows = rows.filter(r => !r.L.el.classList.contains('echo'));
  } else {
    for (const L of placedLabels) {
      L.el.classList.remove('echo');
      L.times.textContent = '';
    }
  }

  const taken = [];
  for (const r of rows) {
    let dy = 0;
    for (let step = 0; step < 40; step++) {
      const top = r.y + dy - r.bh / 2, bot = top + r.bh;
      const clash = taken.some(t =>
        !(r.x + 9 + r.bw <= t.x || t.x + t.bw <= r.x + 9 || bot <= t.top || t.bot <= top));
      if (!clash) break;
      dy = dy >= 0 ? -(dy + r.bh) : -dy;      // alternate above and below
    }
    taken.push({ x: r.x + 9, bw: r.bw, top: r.y + dy - r.bh / 2, bot: r.y + dy + r.bh / 2 });
    r.L.inner.style.transform = `translate(9px, calc(-50% + ${dy.toFixed(1)}px))`;
  }
}

// --- occlusion -----------------------------------------------------------
// Whether the part is actually in the way. The facing test is a proxy for that
// and on anything but a convex lump it is often wrong both ways: it hides a
// feature in plain sight down a bore, and shows one tucked behind a flange.
// Casting a ray is exact, and too slow to do every frame on a dense mesh, so it
// runs once the view settles -- which is when labels get read.
function testOcclusion() {
  // Nothing occludes if the part is hidden or see-through, and a label buried
  // by the part is exactly what someone turns transparency up to read.
  const solid = $('cbPart').checked && Number($('alpha').value) === 0;
  const bias = DATA.bbox.diagonal * 0.004;
  for (const L of placedLabels) {
    if (!solid || !meshes.length) { L.buried = false; continue; }
    const toward = L.tip.clone().sub(camera.position);
    const reach = toward.length();
    occluder.set(camera.position, toward.normalize());
    occluder.near = 0;
    occluder.far = Math.max(reach - bias, 0);
    L.buried = occluder.intersectObjects(meshes, false).length > 0;
  }
}

let frame = 0;
(function tick() {
  requestAnimationFrame(tick);
  advanceFlight();
  controls.update();
  renderer.render(scene, camera);

  // The cube shows the camera's orientation, so it carries the inverse rotation.
  cube.quaternion.copy(camera.quaternion).invert();
  renderer.setScissorTest(true);
  renderer.setViewport(CUBE_EDGE, CUBE_EDGE, CUBE_PX, CUBE_PX);
  renderer.setScissor(CUBE_EDGE, CUBE_EDGE, CUBE_PX, CUBE_PX);
  renderer.autoClear = false;   // float the cube over the part, not over a hole
  renderer.clearDepth();
  renderer.render(cubeScene, cubeCamera);
  renderer.autoClear = true;
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);

  overlay.render(scene, camera);
  if ((frame++ & 1) === 0) declutter();

  // Settled means the camera has not moved for a few frames running.
  if (lastEye.distanceToSquared(camera.position) > 1e-12) {
    lastEye.copy(camera.position);
    still = 0;
  } else if (still >= 0 && ++still === 6) {
    testOcclusion();
    still = -1;
  }
})();
</script>
</body>
